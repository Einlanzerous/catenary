name: publish

# Builds the production image (deploy/Dockerfile: one static Go binary) and
# pushes it to GHCR (CANT-78). construct-server will pull
# ghcr.io/einlanzerous/catenary. `main` publishes :latest and a short-sha tag;
# release-please's v* tags publish the semver tags.
#
# Opened because CANT-16 could not deploy: the compose block references this
# image and nothing had ever built it. CLAUDE.md promised "Release-please + GHCR
# image ghcr.io/einlanzerous/catenary" from the start; this is the half that was
# missing. Chronicle's fragment records the same failure one repo over — a wrong
# claim about which workflow built its image "is why CHRN-16 reached a deploy
# with no artifact to deploy".

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# Two merges to main in quick succession would otherwise race on :latest with no
# ordering guarantee, and the loser silently wins. NOT cancel-in-progress: a
# half-pushed manifest is worse than a slow queue, and the tag path must never be
# cancelled by a subsequent main push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own token. Publishing needs no secret of its own — that is
          # what `permissions: packages: write` above is for.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        # Resolve, ONCE and from the ref, the version this build may claim. The
        # shape chronicle, purser and lyceum share (SERV-154, LYCM-121).
        #
        # `stamp` is what the binary is built with AND what type=semver puts in
        # org.opencontainers.image.version — so on a release `catenary version`
        # and the image label agree by construction. The delivery ledger compares
        # them with STRICT EQUALITY, and a disagreement is a permanently
        # unresolvable row.
        #
        #   (push to main)  -> ""            no version to claim -> `dev`
        #   v1.4.0          -> 1.4.0         a release
        #   v1.5.0-rc.1     -> 1.5.0-rc.1    prerelease. type=semver DOES match
        #                                    and labels the image, so the binary
        #                                    must say the same thing.
        #   vnext           -> ""            not semver; type=semver does not
        #                                    match, so there is no label to agree
        #                                    with, and :sha-<short> below turns
        #                                    back on so the build still has a tag
        #                                    to push.
        #
        # Inputs arrive by env, not by ${{ }} interpolation into the script: a
        # run block that pastes a ref name inline executes whatever it contains.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stamp=""
          # The SemVer 2.0.0 regex from semver.org, translated to POSIX ERE,
          # because this has to agree with node-semver EXACTLY. A looser pattern
          # reopens the bug in a narrower band: a shape this accepts but
          # `semver.valid()` rejects sets `stamp`, which turns the :sha-<short>
          # fallback OFF, while metadata-action emits no tag at all — and
          # build-push-action cannot push an empty tag list. Leading zeros and
          # empty dot-separated identifiers are the two rules doing the work.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [ "$REF_TYPE" = tag ]; then
            candidate="${REF_NAME#v}"
            if printf '%s' "$candidate" | grep -qE "$SEMVER"; then
              # Build metadata is dropped rather than stamped. A Docker tag
              # cannot contain `+`, so metadata-action emits `1.2.3` for
              # `v1.2.3+build.5`; stamping the `+build.5` form would disagree
              # with the label it is compared against.
              stamp="${candidate%%+*}"
            else
              echo "::warning::tag $REF_NAME is not semver; publishing :sha-<short> and stamping no version"
            fi
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/einlanzerous/catenary
          # latest=false. The default `latest=auto` emits :latest BY ITSELF on
          # any type=semver match, independently of the type=raw entry below — so
          # a release, which is pushed to main AND then tagged, publishes :latest
          # twice: once from the main build (VERSION blank, binary reporting
          # `dev`) and once from the tag build. Two runs, two digests, one moving
          # tag, no ordering between them. It fired on purser with the bad
          # outcome (SERV-108).
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Gated on the VALIDATED version rather than on is_default_branch.
            # Release-please tags the release PR's MERGE COMMIT, so the main push
            # and the v* tag build see the same github.sha — with no restriction
            # both runs push sha-<short>, one reporting `dev` and one reporting
            # the semver, and the last writer wins non-deterministically. compose
            # reads ${CATENARY_TAG:-latest}, so pinning a sha tag is expected
            # usage rather than hypothetical.
            type=sha,format=short,enable=${{ steps.ver.outputs.stamp == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION is the validated `stamp`, NOT steps.meta.outputs.version.
          # That output is just the highest-priority tag that matched, so it
          # silently becomes `latest` or `sha-<short>` — and stamping either puts
          # a moving tag into the delivery ledger as an identity, to disagree
          # with the label for ever.
          #
          # On main `stamp` is empty, which buildVersion() maps to "dev" — the
          # honest answer for a build no release cut. The Dockerfile defaults
          # both ARGs to empty for the same reason.
          #
          # GIT_SHA is passed on both paths: a main build has a real commit and
          # should say so, it just has no release to name.
          build-args: |
            VERSION=${{ steps.ver.outputs.stamp }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
