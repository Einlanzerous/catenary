# CANT-11 — the CI matrix.
#
# THE GATE IS `./verify.sh`, RUN WHOLE, AND THAT IS THE DESIGN RATHER THAN A
# SHORTCUT.
#
# The obvious alternative is a job per language, each re-listing the checks
# verify.sh already runs. It gives prettier parallelism and it reintroduces the
# exact failure this ticket's review named: two lists of checks that drift, so
# that "./verify.sh green before anything is handed over" stops being the same
# claim as green CI. The working agreement leans on those being one claim.
#
# So CI's job is what the ticket says it is — to run that one command on a
# machine that is not the author's. The lanes are still visible: verify.sh
# prints one named step per lane with a PASS/FAIL per check, so a failure reads
# as "R4 · Dart" rather than as a wall of output.
#
# TWO JOBS SIT OUTSIDE verify.sh, and both are deliberate exceptions to the
# rule above rather than a second list of the same checks. `build` proves what
# only a clean machine can: that a checkout that never ran `npm` compiles and
# tests, and that the binary CI hands out is static and carries the client.
# `image` (CANT-241) builds deploy/Dockerfile and probes the result, because the
# image is the artefact that ships and CANT-231 is what happens when nothing
# looks at it before a merge: seventeen releases answered `GET /` with a 404.
# verify.sh does not build images — it runs on machines without a Docker
# daemon, and an image build is minutes, not seconds — so `./verify.sh` green
# and green CI are one claim about the code and one more about the image. The
# probe itself is one script, deploy/probe-client.sh, that publish.yml's smoke
# runs too, so the pre-merge and post-publish checks of the image cannot
# drift into two lists either.
#
# What is NOT here: release-please and PUSHING the GHCR image. Publishing is
# CANT-16's deploy path (publish.yml) rather than the test matrix; `image`
# builds and probes, and pushes nothing.

name: CI

# `push` is main-only. A push to a branch with an open PR fires BOTH triggers,
# and the concurrency group keys on `github.ref` — `refs/heads/<branch>` for one
# and `refs/pull/N/merge` for the other — so neither cancels the other and every
# push ran the whole matrix twice. On a stack five PRs deep that was the
# dominant CI cost. Branch pushes are covered by `pull_request`; `main` needs
# its own trigger because merges arrive there without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh — Go, web, Dart, conformance ×3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The store's schema tests need a real Postgres, and 16 specifically:
      # the shared instance is 16, and CANT-13 leans on partial unique indexes
      # and array element CHECKs that a version drift would quietly change.
      #
      # `POSTGRES_HOST_AUTH_METHOD: trust` rather than a password, and the
      # reason is not convenience. A service container lives and dies inside
      # this job's own network namespace and is reachable from nothing else, so
      # any password here is theatre — but it is password-SHAPED theatre, which
      # means a secret scanner reports it on every pull request forever and
      # somebody has to dismiss it every time. A check that is routinely
      # dismissed is a check nobody reads. Removing the literal removes the
      # finding at its source instead of teaching people to wave it through.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: catenary_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CATENARY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/catenary_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Both modules declare go 1.26, so one toolchain covers them and
          # nothing here reads a range.
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # verify.sh finds dart on PATH or at $DART; setup-dart puts it on PATH,
      # so the local ~/tools/dart-sdk fallback is not needed here.
      # `sdk: stable`, not a version wildcard: setup-dart takes a CHANNEL or an
      # exact version, and `3.x` makes it fail with a JSNull type error that
      # says nothing about the cause. The real constraint is dart/pubspec.yaml's
      # `sdk: ^3.6.0`; pinning an exact version here would only mean CI tests a
      # Dart nobody is developing against.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      # catenary_client (CANT-42) depends on catenary_wire by path, so it
      # resolves second. package:sqlite3's library arrives through its build
      # hook when the tests first run, inside verify.sh.
      - name: Install Dart client dependencies
        working-directory: dart-client
        run: dart pub get

      # Recorded so a lane that goes red on a toolchain bump says so in its own
      # log rather than in somebody's afternoon. gofmt is listed because the
      # generator now REQUIRES it — CANT-15 made it format the emitted Go on
      # the way out, and a missing gofmt is a hard failure there rather than a
      # silently unformatted file. The gofmt GATES live in verify.sh.
      - name: Toolchain versions
        run: |
          go version
          node --version
          dart --version
          command -v gofmt

      - name: ./verify.sh
        run: ./verify.sh

  build:
    name: build the static binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # CANT-241's pristine checkout: BEFORE any Node step, so the tree is
      # literally one that never ran `npm` — no node_modules, no Vite output.
      # internal/webui's committed placeholder is what makes the embed compile
      # here; the binary this builds serves no client and says so at boot.
      - name: A checkout that never ran npm builds and tests
        run: go build ./... && go test ./...

      # Then the client, so the binary uploaded below carries it and the
      # static-link and version assertions apply to the real thing. vite build
      # alone, as the image runs it; gen:check and vue-tsc are verify.sh's.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web client into internal/webui
        working-directory: web
        run: |
          npm ci
          npx --no-install vite build

      - name: The embedded client is servable
        run: CATENARY_WEB_REQUIRED=1 go test ./internal/webui/

      # CGO_ENABLED=0 is the point of "single static Go binary": the image is
      # scratch-adjacent and nothing in it links libc.
      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
            -o catenary ./cmd/catenary

      # A binary that builds and cannot run is a binary CI said yes to. The
      # version subcommand touches no dependency, so this is the one assertion
      # that works without a database.
      - name: It runs, and reports what it is
        run: |
          ./catenary version
          test "$(./catenary version | tail -1)" = "${GITHUB_SHA}"

      - name: Statically linked
        run: |
          file ./catenary
          ! ldd ./catenary 2>/dev/null | grep -q "=>" || (echo "binary is dynamically linked"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: catenary-${{ github.sha }}
          path: catenary
          retention-days: 7

  # CANT-241. The image is the artefact, so the image is what gets probed: build
  # deploy/Dockerfile exactly as publish.yml does (no push), run it against a
  # Postgres service the way publish.yml's smoke does — `catenary serve`
  # connects before it listens — and run deploy/probe-client.sh against it.
  image:
    name: build the image and probe the web client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same service, same reasoning as `verify` above and publish.yml's smoke.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: catenary
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: catenary:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: run the image
        run: |
          set -euo pipefail
          docker run -d --name catenary-ci --network host \
            -e CATENARY_PORT=4012 \
            -e CATENARY_DATABASE_URL="host=127.0.0.1 port=5432 user=postgres dbname=catenary sslmode=disable" \
            catenary:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4012/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::/healthz never answered"; exit 1

      - name: the boot line says the client is embedded
        run: docker logs catenary-ci 2>&1 | grep '"msg":"web client embedded"'

      - name: deploy/probe-client.sh
        run: deploy/probe-client.sh http://127.0.0.1:4012

      - name: container logs on failure
        if: failure()
        run: docker logs catenary-ci || true
