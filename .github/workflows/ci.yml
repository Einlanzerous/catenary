# CANT-11 — the CI matrix.
#
# THE GATE IS `./verify.sh`, RUN WHOLE, AND THAT IS THE DESIGN RATHER THAN A
# SHORTCUT.
#
# The obvious alternative is a job per language, each re-listing the checks
# verify.sh already runs. It gives prettier parallelism and it reintroduces the
# exact failure this ticket's review named: two lists of checks that drift, so
# that "./verify.sh green before anything is handed over" stops being the same
# claim as green CI. The working agreement leans on those being one claim.
#
# So CI's job is what the ticket says it is — to run that one command on a
# machine that is not the author's. The lanes are still visible: verify.sh
# prints one named step per lane with a PASS/FAIL per check, so a failure reads
# as "R4 · Dart" rather than as a wall of output.
#
# What is NOT here: release-please and the GHCR image. CLAUDE.md names both,
# neither is in this ticket's Done-when, and publishing is CANT-16's deploy
# path rather than the test matrix.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh — Go, web, Dart, conformance ×3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The store's schema tests need a real Postgres, and 16 specifically:
      # the shared instance is 16, and CANT-13 leans on partial unique indexes
      # and array element CHECKs that a version drift would quietly change.
      #
      # `POSTGRES_HOST_AUTH_METHOD: trust` rather than a password, and the
      # reason is not convenience. A service container lives and dies inside
      # this job's own network namespace and is reachable from nothing else, so
      # any password here is theatre — but it is password-SHAPED theatre, which
      # means a secret scanner reports it on every pull request forever and
      # somebody has to dismiss it every time. A check that is routinely
      # dismissed is a check nobody reads. Removing the literal removes the
      # finding at its source instead of teaching people to wave it through.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: catenary_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CATENARY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/catenary_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Both modules pin the same toolchain. Nothing here reads a range.
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # verify.sh finds dart on PATH or at $DART; setup-dart puts it on PATH,
      # so the local ~/tools/dart-sdk fallback is not needed here.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.x"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Dart dependencies
        working-directory: dart
        run: dart pub get

      # Recorded so a lane that goes red on a toolchain bump says so in its own
      # log rather than in somebody's afternoon. gofmt is listed because the
      # generator now REQUIRES it — CANT-15 made it format the emitted Go on
      # the way out, and a missing gofmt is a hard failure there rather than a
      # silently unformatted file. The gofmt GATES live in verify.sh.
      - name: Toolchain versions
        run: |
          go version
          node --version
          dart --version
          command -v gofmt

      - name: ./verify.sh
        run: ./verify.sh

  build:
    name: build the static binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # CGO_ENABLED=0 is the point of "single static Go binary": the image is
      # scratch-adjacent and nothing in it links libc.
      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
            -o catenary ./cmd/catenary

      # A binary that builds and cannot run is a binary CI said yes to. The
      # version subcommand touches no dependency, so this is the one assertion
      # that works without a database.
      - name: It runs, and reports what it is
        run: |
          ./catenary version
          test "$(./catenary version | tail -1)" = "${GITHUB_SHA}"

      - name: Statically linked
        run: |
          file ./catenary
          ! ldd ./catenary 2>/dev/null | grep -q "=>" || (echo "binary is dynamically linked"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: catenary-${{ github.sha }}
          path: catenary
          retention-days: 7
