name: Release Please

# Automated releases (CANT-78). Release Please watches conventional commits on
# main and maintains a release PR (version bump + CHANGELOG). Merging that PR
# creates the tag and the GitHub Release; publish.yml then builds the semver
# image from the v* tag. No hand-cut tags.
#
# PRINCIPLES.md is explicit that this is not optional: "All repos follow
# Conventional Commits + release-please. New repos go on this flow on day one."
# Catenary had neither until this ticket, which is also why nothing had ever
# built its image.
#
# CLAUDE.md requires conventional commits and puts the `feat:`/`fix:` prefix in
# the COMMIT MESSAGE rather than the branch name — this workflow is the reason
# that distinction matters: release-please reads the commit, and the branch name
# is invisible to it.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token from the GitHub App so the release
      # PR and tag are created by the App identity rather than the default
      # GITHUB_TOKEN.
      #
      # This is load-bearing, not cosmetic. Events raised by GITHUB_TOKEN do not
      # trigger other workflows (GitHub's anti-recursion safeguard), so a release
      # PR opened by it would never run its own required checks, and the tag it
      # eventually pushed would never reach publish.yml — leaving a release with
      # no image, which is the exact failure this ticket exists to end.
      #
      # RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY are Signet-managed from the
      # `imperium-loop` project and fanned out to every releasing repo. Matches
      # the chronicle / switchyard / lyceum / purser setup. If they are not yet
      # fanned out to THIS repo, this job fails at the mint step with a clear
      # error rather than silently releasing under the wrong identity.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # The config carries `initial-version: 0.1.0` (CANT-80), and JSON cannot
      # hold the reason, so it lives here.
      #
      # With no prior tag release-please takes its INITIAL RELEASE path, whose
      # default is 1.0.0 — `bump-minor-pre-major` never gets a say, and the
      # manifest's seeded 0.0.0 is not read as a release to bump from. Left
      # alone it opened PR #13 as `chore(main): release 1.0.0`, for a service
      # that answered /healthz and nothing else. `initial-version` applies only
      # while there is no release, so it goes inert the moment v0.1.0 is tagged
      # and needs no follow-up commit to remove — unlike `release-as`, which the
      # schema marks deprecated and which pins EVERY later release until deleted.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
