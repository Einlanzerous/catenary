name: app

# The Flutter client (E5, CANT-40). Its own workflow, scoped by path, so a
# server-only pull request does not pay for a Flutter toolchain and an Android
# build — the way the estate's other Flutter apps are checked (Chronicle's and
# Argosy's mobile.yml).
#
# web/src/styles/tokens.css IS IN THE PATH FILTER, and that is load-bearing:
# app/lib/tokens.dart is that table in a second runtime and app/test reads the
# CSS to hold it there, so a pull request that edits only the web client's
# tokens is exactly the one that makes the app's table stale.
#
# web/smoke.ts and server/spec/testdata/read-fraction.json are in for the same
# reason: app/test/typing_test.dart and app/test/states_test.dart read them.
# web/src/account.ts likewise: app/test/enroll_failures_test.dart reads the
# web's enrollment sentences out of it.
# app/test/pins_test.dart derives that list from what app/test opens and fails
# when either list here misses one (CANT-203 ruling 2).
#
# dart/ and dart-client/ are in because the app is built on them: the generated
# wire package and the protocol half (CANT-42), path dependencies of
# app/pubspec.yaml since CANT-206. What runs here on a change there is that the
# app still analyzes, tests and builds against them. Their own tests run in
# ci.yml.
on:
  pull_request:
    paths:
      - "app/**"
      - "web/src/styles/tokens.css"
      - "web/smoke.ts"
      - "web/src/account.ts"
      - "server/spec/testdata/read-fraction.json"
      - "schema/vectors/link-detection.json"
      - "dart/**"
      - "dart-client/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/src/styles/tokens.css"
      - "web/smoke.ts"
      - "web/src/account.ts"
      - "server/spec/testdata/read-fraction.json"
      - "schema/vectors/link-detection.json"
      - "dart/**"
      - "dart-client/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  # The two versions the local toolchain pins (~/dev-tools/env.sh): Temurin 17
  # and Flutter 3.44.2 stable. A skew between CI and the box is a class of
  # "works here, fails there" nobody should have to debug twice.
  FLUTTER_VERSION: "3.44.2"
  JAVA_VERSION: "17"

jobs:
  android:
    name: app — analyze, test, Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Includes the token contract: test/tokens_test.dart reads the web
      # client's tokens.css and fails when either table moves alone.
      - run: flutter test

      # A DEBUG apk. It proves the Android half compiles — Gradle, the manifest
      # and its placeholders, the bundled fonts — without a signing key, which
      # nothing here has and no release lane yet needs.
      - run: flutter build apk --debug

      # CANT-327: the `record` plugin declares RECORD_AUDIO in its own library
      # manifest, and the main manifest strips it until CANT-56 flips the voice
      # gate. This reads the MERGED manifest, which the source-level test in
      # test/manifest_test.dart cannot see, so a plugin upgrade or a typo in the
      # directive shows up here. A moved path fails rather than reading as green.
      # CANT-56 deletes this step with the manifest line, in the same PR.
      - name: merged manifest declares no RECORD_AUDIO
        run: |
          merged=build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          test -f "$merged" || { echo "::error::merged manifest not found at $merged"; exit 1; }
          if grep -q 'android.permission.RECORD_AUDIO' "$merged"; then
            echo "::error::RECORD_AUDIO is in the merged manifest while voiceSendEnabled is false (CANT-327)"
            exit 1
          fi
