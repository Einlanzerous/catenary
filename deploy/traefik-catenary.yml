# Catenary routers for config/traefik/dynamic/routers.yml.
#
# Paste into the existing `http.routers` map in that file — this is a fragment,
# not a loadable standalone config. Shape is Chronicle's (CHRN-16) and Lyceum's
# (SERV-60): the SAME backend on two hosts, one tunneled and Access-gated, one
# direct on the WAN entrypoint where the app authenticates itself.
#
# CANT-16's Done-when is "/admin is behind Access while /sync and the socket are
# not". That is the split below — and note what it is NOT: matching on Host
# alone would serve /admin from the public router too. Chronicle records that
# exact trap, so the /admin blackhole is written here from the start rather
# than after someone notices.
#
# D2 is the reason the socket cannot sit behind Access: Access is a browser SSO
# wall, and a Flutter client holding a bearer token cannot open one.

http:
  routers:
    # ------------- INTERNAL entrypoint: tunneled, Access-enforced -------------
    # Reachable only via cloudflared. Carries cf-access-jwt like every other
    # router on this entrypoint (SERV-106); check-edge-auth.sh fails if a new
    # one is added without it.
    #
    # Adding this router ALSO requires adding catenary.zerogravity.industries
    # to the guard's CF_ACCESS_AUD_MAP — check #2 of check-edge-auth.sh requires
    # the map to cover exactly the gated hosts, so a router with no AUD entry
    # fails the config check rather than silently serving unmapped.
    #
    # Today this host serves only /healthz and /readyz, which is the whole
    # service. /admin arrives with CANT-69.
    catenary:
      entryPoints:
        - internal
      rule: "Host(`catenary.zerogravity.industries`)"
      service: catenary
      middlewares:
        - cf-access-jwt
      # No TLS: internal is plain HTTP. Cloudflare terminates at the edge and
      # the tunnel encrypts the wire.

    # ------------- PUBLIC entrypoint: the client path -------------
    #
    # WRITTEN AND LEFT COMMENTED OUT, on Chronicle's precedent, because the bar
    # for a router on `public` is that the endpoint authenticates "with
    # something Cloudflare Access cannot express" — and Catenary does not
    # authenticate at all yet.
    #
    # Today the service is /healthz and /readyz. The socket is CANT-22, the
    # token model is CANT-28, refresh rotation is CANT-29. Uncommenting any of
    # this before those land puts an unauthenticated service that will hold
    # everyone's messages on the open 443.
    #
    # UNCOMMENT WHEN: CANT-22 and CANT-28 have landed, and not before.
    #
    # catenary-public:
    #   entryPoints:
    #     - public
    #   rule: "Host(`catenary-direct.zerogravity.industries`)"
    #   service: catenary
    #   middlewares:
    #     - crowdsec-bouncer
    #     # strip-cf-access ensures a spoofed Cf-Access-* on this path
    #     # authenticates nobody.
    #     - strip-cf-access
    #   tls:
    #     certResolver: letsencrypt
    #     domains:
    #       - main: "zerogravity.industries"
    #         sans:
    #           - "*.zerogravity.industries"
    #
    # The WebSocket needs no special router. Traefik proxies the Upgrade
    # handshake on the same router as the rest of the host; R1 measured this
    # exact path end to end — one socket held 1h20m through a real tunnel at a
    # flat 9 ms RTT (spike/r1-websocket). What CANT-16 deploys is the thing R1
    # proved, not a new question.
    #
    # /admin is NOT served on the WAN host. Matching on Host alone would serve
    # it from catenary-public above, which is precisely what CANT-16's
    # Done-when forbids. Highest priority so it beats the router above, pointed
    # at the same blackhole + deny-all pair public-catchall uses, so the
    # response is a 403 rather than a route into the admin surface.
    #
    # catenary-public-admin-denied:
    #   entryPoints:
    #     - public
    #   rule: "Host(`catenary-direct.zerogravity.industries`) && PathPrefix(`/admin`)"
    #   priority: 1000
    #   service: blackhole
    #   middlewares:
    #     - deny-all
    #   tls:
    #     certResolver: letsencrypt
    #     domains:
    #       - main: "zerogravity.industries"
    #         sans:
    #           - "*.zerogravity.industries"

  services:
    catenary:
      loadBalancer:
        servers:
          - url: "http://catenary:4012"
