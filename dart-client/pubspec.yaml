name: catenary_client
description: >-
  The Catenary client's protocol half in pure Dart: the journal, transport,
  credential layer and outbox over real SQLite files (CANT-42). It imports no
  Flutter library, so a plain `dart` executable can host it as a driver.
version: 0.1.0
publish_to: none

# 3.10, where `dart/` says 3.6: package:sqlite3 builds its library through a
# native-asset hook, and hooks are stable from 3.10.
environment:
  sdk: ^3.10.0

dependencies:
  catenary_wire:
    path: ../dart
  ffi: ^2.1.0
  meta: ^1.16.0
  # Held to 3.5.x, the newest line the Flutter app can resolve, so the app runs
  # the sqlite3 these tests run (CANT-220 ruling 3). 3.6.0 is the first to need
  # hooks ^2.2.0, which needs record_use ^1.0.0, which needs meta ^1.19.0, and
  # Flutter 3.44.2 pins meta to 1.18.0. Lift the ceiling when the app's Flutter
  # pins meta >= 1.19; app/test/pins_test.dart fails if the two lockfiles ever
  # name different versions.
  sqlite3: ">=3.5.2 <3.6.0"

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
