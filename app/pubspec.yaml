name: catenary
description: "Catenary — a self-hosted chat client for Android and Linux desktop."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # The protocol half and its wire types, by path (CANT-200). Only
  # lib/store/ imports catenary_client.
  catenary_client:
    path: ../dart-client
  catenary_wire:
    path: ../dart
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5

# catenary_client asks for sqlite3 ^3.7.0, which needs hooks ^2.2.0, which needs
# record_use ^1.0.0, which needs meta ^1.19.0 — and Flutter 3.44.2 pins meta to
# 1.18.0, so the app cannot resolve it. 3.5.2 is the newest sqlite3 that does
# (3.6.0 is the first to need that hooks). Only the root's overrides count, so
# dart-client keeps its own constraint under the plain `dart` SDK. Drop this
# when Flutter's pinned meta reaches 1.19.
dependency_overrides:
  sqlite3: 3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # IBM Plex Sans and Mono, bundled: the web client loads them from Google
  # Fonts, and an app for a self-hosted service does not phone a third party
  # for its typeface. SIL OFL 1.1 — assets/fonts/OFL.txt.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
