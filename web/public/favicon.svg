<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Catenary logomark, canvas section 07 form 1C "Span": the same geometry
       as src/components/Logomark.vue. The fill is the dark theme's
       accent-mark token, written as a hex because a favicon cannot read a
       stylesheet — the one raw color in the client, and the reason it is
       kept out of src/. -->
  <mask id="span" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
    <rect width="48" height="48" fill="#fff"/>
    <g fill="#000">
      <rect x="10" y="12" width="3.4" height="28"/>
      <rect x="34.6" y="12" width="3.4" height="28"/>
      <rect x="5" y="31" width="38" height="2.4"/>
    </g>
    <path d="M12 15 Q24 27 36 15" fill="none" stroke="#000" stroke-width="3"/>
  </mask>
  <rect width="48" height="48" fill="#e5a03c" mask="url(#span)"/>
</svg>
