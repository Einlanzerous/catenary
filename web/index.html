<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <!-- CANT-371: the document is dark until main.ts reads the OS preference,
         so a light-preferring machine flashed dark first. Paint the light
         base colour (tokens.css --surface-base, light) until the script runs.
         Inline style is allowed by the document CSP; inline script is not. -->
    <style>
      @media (prefers-color-scheme: light) {
        html {
          background: #f7f6f3;
        }
      }
    </style>
    <title>Catenary</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
